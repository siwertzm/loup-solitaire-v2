spring.application.name=backend

# === DATABASE ===
# Valeurs par defaut adaptees au conteneur Docker local (voir README).
# En production, ces 3 variables d'environnement doivent etre definies explicitement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# === JPA ===
# "update" par defaut : cree les tables manquantes sans effacer les donnees
# existantes (important avec Docker + volume Postgres persistant). Mettre
# DDL_AUTO=create en local le temps du developpement actif si tu veux repartir
# de zero a chaque redemarrage. A remplacer par des migrations Flyway/Liquibase
# avant la mise en production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# === Encodage UTF-8 ===
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

# === JWT ===
# JWT_SECRET doit etre une cle Base64 d'au moins 256 bits (32 octets).
# Generer une valeur avec : openssl rand -base64 32
# Ne jamais committer la vraie valeur : definir la variable d'environnement en local
# et dans la configuration de deploiement.
jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_secret_do_not_use_in_prod_1234567890}
# Token d'acces : duree de vie courte (15 min par defaut). C'est le refresh
# token ci-dessous qui porte la "session longue" pour l'app mobile.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token : duree de vie longue, stocke hache en base, revocable
# individuellement (logout) ou en masse (detection de rejeu).
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# === CORS ===
# Origines multiples separees par des virgules. En plus du serveur de dev Angular
# (localhost:4200), les apps natives Capacitor utilisent des origines fixes :
# iOS = capacitor://localhost, Android = http://localhost ou https://localhost
# selon capacitor.config.ts (server.androidScheme). A ajuster une fois le build
# natif genere - verifie l'origine reelle envoyee par ton app (log cote backend).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,capacitor://localhost,http://localhost,https://localhost}

# === Actuator (healthcheck Docker) ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
