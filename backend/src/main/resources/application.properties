spring.application.name=backend

# ============================================================
# DATABASE
# ============================================================
# Valeurs par defaut adaptees au conteneur Docker local.
# En production, DB_URL, DB_USERNAME et DB_PASSWORD doivent
# etre definis explicitement dans les variables Render.
#
# Sur Render, utiliser l'adresse INTERNE PostgreSQL :
# jdbc:postgresql://HOST_INTERNE:5432/NOM_DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# ============================================================
# HIKARICP - POOL DE CONNEXIONS POSTGRESQL
# ============================================================

# Nombre maximum de connexions PostgreSQL ouvertes
# simultanement par une instance du backend.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

# Nombre minimum de connexions gardees disponibles.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# Temps maximum d'attente pour obtenir une connexion
# depuis le pool avant de retourner une erreur.
# Valeur en millisecondes : 5 secondes.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:5000}

# Temps apres lequel une connexion inutilisee peut etre fermee.
# Valeur en millisecondes : 5 minutes.
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}

# Duree de vie maximale d'une connexion dans le pool.
# Valeur en millisecondes : 30 minutes.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# Temps maximum accorde pour verifier qu'une connexion
# PostgreSQL est encore valide.
# Valeur en millisecondes : 3 secondes.
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:3000}

# Nom du pool visible dans les logs et les metriques.
spring.datasource.hikari.pool-name=LoupSolitaireHikariPool


# ============================================================
# VIRTUAL THREADS (Java 21)
# ============================================================

# Chaque requete HTTP est traitee sur un thread virtuel : un thread
# qui attend PostgreSQL ou le serveur SMTP ne bloque plus un thread
# systeme, le serveur supporte donc plus de requetes simultanees.
# Le pool Hikari (DB_POOL_MAX) reste la limite cote base de donnees.
spring.threads.virtual.enabled=${VIRTUAL_THREADS:true}


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Liquibase gere les modifications de structure de la DB.
# Hibernate verifie seulement que la structure correspond
# aux entites Java.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Desactive l'affichage de toutes les requetes SQL par defaut.
# En developpement local, utiliser SHOW_SQL=true si necessaire.
spring.jpa.show-sql=${SHOW_SQL:false}

# Evite de garder une connexion / session Hibernate ouverte
# jusqu'a la fin de la requete HTTP.
spring.jpa.open-in-view=false


# ============================================================
# LIQUIBASE
# ============================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


# ============================================================
# JWT
# ============================================================

# JWT_SECRET doit etre une cle Base64 d'au moins 256 bits
# (32 octets).
#
# Generer une valeur avec :
# openssl rand -base64 32
#
# Ne jamais committer la vraie valeur.
# Definir JWT_SECRET dans les variables d'environnement
# en local et sur Render.
jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_secret_do_not_use_in_prod_1234567890}

# Token d'acces :
# duree de vie courte, 15 minutes par defaut.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh token :
# duree de vie longue, stocke hache en base et revocable
# individuellement ou en masse.
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}


# ============================================================
# CORS
# ============================================================

# Origines multiples separees par des virgules.
#
# Angular local :
# http://localhost:4200
#
# Capacitor iOS :
# capacitor://localhost
#
# Capacitor Android :
# http://localhost ou https://localhost
#
# A ajuster selon les origines reellement utilisees
# par les builds natifs.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,capacitor://localhost,http://localhost,https://localhost}


# ============================================================
# ACTUATOR / HEALTHCHECK
# ============================================================

# Expose uniquement le endpoint de verification de sante.
management.endpoints.web.exposure.include=health

# Ne retourne pas les details internes dans la reponse HTTP.
management.endpoint.health.show-details=never

# Desactive l'indicateur SMTP dans /actuator/health.
#
# Spring Boot peut sinon tester automatiquement le serveur SMTP
# lors des healthchecks.
#
# Une panne ou un refus SMTP ne doit pas faire passer tout
# le backend en DOWN alors que l'API fonctionne correctement.
management.health.mail.enabled=false


# ============================================================
# EMAIL - VERIFICATION DE COMPTE
# ============================================================

# En developpement :
# Mailtrap peut etre utilise pour capturer les emails.
#
# En production :
# definir MAIL_HOST, MAIL_PORT, MAIL_USERNAME et MAIL_PASSWORD
# avec les informations Brevo ou d'un autre fournisseur SMTP.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Adresse affichee comme expediteur.
app.mail.from=${MAIL_FROM:no-reply@loup-solitaire.local}

# Base de l'URL utilisee dans le lien de confirmation
# envoye par email.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Duree de validite du lien de confirmation en heures.
app.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}


# ============================================================
# REINITIALISATION DU MOT DE PASSE
# ============================================================

# Duree de validite du code recu par email en minutes.
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}

# Nombre maximum de codes incorrects avant invalidation.
app.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}


# ============================================================
# APPLICATION MOBILE
# ============================================================

# Deep link utilise apres validation de l'adresse email.
app.mobile-login-url=${APP_MOBILE_LOGIN_URL:loupsolitaire://auth/login?emailVerified=true}