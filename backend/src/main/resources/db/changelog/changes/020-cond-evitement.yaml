databaseChangeLog:

  - changeSet:
      id: 020-cond-evitement
      author: siwertzm

      changes:
        - sqlFile:
            path: 020-cond-evitement.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

      rollback:
        - sql:
            sql: DELETE FROM public.cond WHERE type = 'EVITEMENT';
        - sql:
            sql: ALTER TABLE public.cond DROP CONSTRAINT cond_type_check;
        - sql:
            sql: >
              ALTER TABLE public.cond ADD CONSTRAINT cond_type_check CHECK ((type)::text = ANY (ARRAY[
              'DISCIPLINE', 'OBJET', 'BOURSE', 'HASARD', 'FUITE', 'ARME', 'ENDURANCE',
              'ENDURANCE_PERDUE', 'ENDURANCE_INF', 'ASSAUT_MAX', 'ASSAUT_MIN', 'ASSAUT_ECHEC',
              'VICTOIRE', 'PERMANENT', 'SANS_ARME']::text[]));
