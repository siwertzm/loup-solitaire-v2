server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionnes (hash dans le nom de fichier genere par Angular) :
    # cache long, ils changent de nom a chaque build.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais etre mis en cache : c'est lui qui reference
    # les assets versionnes du build courant.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : toute route inconnue de nginx est renvoyee vers index.html,
    # le routing cote client (Angular Router) prend le relai.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
