name: Backend CI + SonarCloud

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/sonar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # Necessaire a Sonar pour analyser correctement l'historique
          # (detection du "nouveau code", blame par commit...).
          fetch-depth: 0

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache des dependances Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # mvn verify execute les tests (avec couverture JaCoCo instrumentee),
      # puis le plugin Sonar envoie le rapport + le code a SonarCloud.
      - name: Build, tests et analyse SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=siwertzm_loup-solitaire-v2
          -Dsonar.organization=siwertzm
          -Dsonar.host.url=https://sonarcloud.io