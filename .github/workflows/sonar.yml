name: CI backend + frontend + SonarCloud

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/sonar.yml'
  # QUAL-01 : sur les PR, pas de filtre de chemins. Ce job est le controle
  # obligatoire avant fusion (protection de la branche main) : filtre, il ne
  # tournerait pas sur une PR sans changement backend, qui resterait alors
  # bloquee en attente d'un controle jamais lance.
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7
        with:
          # Necessaire a Sonar pour analyser correctement l'historique
          # (detection du "nouveau code", blame par commit...).
          fetch-depth: 0

      # QUAL-06 : tests frontend (Vitest) dans le controle obligatoire de PR ;
      # un test en echec fait echouer le job.
      - name: Installer Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances frontend
        working-directory: frontend
        # --legacy-peer-deps : obligatoire (peer deps Ionic/Capacitor, voir CLAUDE.md)
        run: npm ci --legacy-peer-deps

      - name: Tests frontend
        working-directory: frontend
        run: npm test -- --watch=false

      # SEC-07 : faille connue de gravite haute ou critique dans une
      # dependance livree avec l'app (hors outils de developpement) -> echec.
      - name: Failles connues des dependances frontend (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Installer JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache des dependances Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache Sonar
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # mvn verify execute les tests unitaires, puis les tests d'integration
      # (*IT) sur un vrai PostgreSQL lance par Testcontainers (Docker est
      # disponible sur ubuntu-latest), avec couverture JaCoCo ; un test en
      # echec fait echouer le job. Puis le plugin Sonar envoie le rapport +
      # le code a SonarCloud.
      - name: Build, tests et analyse SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=siwertzm_loup-solitaire-v2
          -Dsonar.organization=siwertzm
          -Dsonar.host.url=https://sonarcloud.io

      # SEC-07 : scan du jar de production (toutes les dependances livrees).
      # Faille HIGH ou CRITICAL deja corrigee par une version -> echec ; la
      # correction est presque toujours une montee de version (souvent
      # proposee par Dependabot). Image officielle a version figee, pas
      # d'action GitHub tierce.
      - name: Failles connues des dependances backend (Trivy)
        run: >
          docker run --rm -v "$PWD/target":/scan aquasec/trivy:0.58.1
          rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /scan
