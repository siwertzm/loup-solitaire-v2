# SEC-07 : une PR par semaine et par ecosysteme pour mettre les dependances a
# jour (versions corrigeant des failles comprises). Mises a jour mineures et
# correctives regroupees pour limiter le nombre de PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
